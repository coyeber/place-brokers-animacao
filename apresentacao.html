class Motion3D {
 constructor(){this.host=null;this.renderer=null;this.scene=null;this.camera=null;this.frame=null;this.resizeObserver=null;this.targets=[];this.id=0;this.mode='';this.t0=0;this.nodeGroup=null;this.step=0;}
 async mount(host){this.dispose();if(!host||window.matchMedia('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('reduced-motion'))return; const token=++this.id; let T=await get3D();if(token!==this.id||!T||!host.isConnected)return;
 try{this.host=host;this.mode=host.dataset.three;const renderer=new T.WebGLRenderer({alpha:true,antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;this.renderer=renderer;host.appendChild(renderer.domElement);host.classList.add('three-ready');host.parentElement?.classList.add('has-three');this.scene=new T.Scene();this.camera=new T.PerspectiveCamera(38,1,.1,100);this.camera.position.z=9;
 this.scene.add(new T.AmbientLight(0xffffff,1.5));const light=new T.DirectionalLight(0xffd89d,4);light.position.set(-3,6,9);this.scene.add(light);const glow=new T.PointLight(0xdca65c,60,20);glow.position.set(4,-2,5);this.scene.add(glow);

 pin(T){const s=new T.Shape();s.moveTo(0,-1.86);s.bezierCurveTo(-.4,-1.42,-1.6,-.31,-1.48,.85);s.bezierCurveTo(-1.33,1.94,-.61,2.27,0,2.27);s.bezierCurveTo(.8,2.27,1.45,1.53,1.48,.7);s.bezierCurveTo(1.5,-.53,.36,-1.59,0,-1.86);const hole=new T.Path();hole.absellipse(0,.81,.49,.64,0,Math.PI*2,false);s.holes.push(hole);const geometry=new T.ExtrudeGeometry(s,{depth:.35,steps:1,bevelEnabled:true,bevelThickness:.09,bevelSize:.07,bevelSegments:3,curveSegments:48});geometry.center();const mesh=new T.Mesh(geometry,new T.MeshStandardMaterial({color:0xdba760,metalness:.75,roughness:.25,emissive:0x241403,emissiveIntensity:.14}));mesh.rotation.set(-.1,-.38,-.08);this.scene.add(mesh);this.targets.push({kind:'pin',mesh});const sphere=new T.Mesh(new T.SphereGeometry(.27,30,24),new T.MeshStandardMaterial({color:0xe8b971,metalness:.4,roughness:.32}));sphere.position.set(0,.41,.03);mesh.add(sphere);this.camera.position.z=8.7;}
 nodes(T){const group=new T.Group();this.scene.add(group);const boxes=[];for(let i=0;i<5;i++){const geo=new T.BoxGeometry(1.24,.82,.28);const material=new T.MeshStandardMaterial({color:i===0?0xdba760:0x224662,metalness:.4,roughness:.35});const node=new T.Mesh(geo,material);node.position.set((i-2)*1.69,0,0);group.add(node);boxes.push(node);const edge=new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:0xdba760,transparent:true,opacity:.6}));node.add(edge);if(i<4){const tube=new T.Mesh(new T.CylinderGeometry(.035,.035,.46,10),new T.MeshStandardMaterial({color:0xb58d58}));tube.rotation.z=-Math.PI/2;tube.position.set((i-2)*1.69+.83,0,0);group.add(tube)}}const orb=new T.Mesh(new T.SphereGeometry(.18,24,24),new T.MeshStandardMaterial({color:0xffe0a2,emissive:0xbd762e,emissiveIntensity:.4}));orb.position.set(-3.38,1,.2);group.add(orb);this.camera.position.set(0,1,10);this.camera.lookAt(0,0,0);this.targets.push({kind:'nodes',group,boxes,orb});this.nodeGroup=group;}

function scene5(s){return node(s,`<div class="mobile-layout"><div class="phone-visual pop" ${delay(2)}><div class="phone-halo"></div><div class="phone"><div class="phone-shine"></div><div class="phone-screen"><div class="phone-brand"><b>PLACE BROKERS</b><small>09:41</small></div><h3>Olá, corretor 👋</h3><div class="phone-notice">● Novo lead disponível<small>Interesse em apartamento · atender agora</small></div><div class="phone-info"><strong>Contato recebido</strong><div class="phone-actions"><button data-contact="ligar">☎ Ligar</button><button data-contact="whatsapp">◉ WhatsApp</button></div><p>◷ Agendamento de visitas<br>▣ Book e tabela atualizados</p></div></div></div></div><div class="feature-list">${s.cards.map((c,i)=>`<div class="feature-row reveal" ${delay(i+1)}><div class="feature-icon">${['⚡','☎','◷','▣'][i]}</div><div><strong>${esc(c.title)}</strong><span>${esc(c.text)}</span></div></div>`).join('')}</div></div>`, 'light','mobile-scene')}
function scene6(s){return node(s,`<div class="dash-layout"><div class="dash-copy">${s.cards.map((c,i)=>`<div class="reveal" ${delay(i+1)}><strong>${esc(c.title)}</strong><p>${esc(c.text)}</p></div>`).join('')}</div><div class="board pop" ${delay(2)} aria-label="Painel gerencial demonstrativo com dados fictícios"><div class="board-top"><strong>Gestão comercial · visão geral</strong><span class="demo-tag">DADOS FICTÍCIOS</span></div><div class="board-kpis"><div class="board-kpi"><small>Leads do mês</small><strong data-count="284">0</strong></div><div class="board-kpi"><small>Leads atendidos</small><strong>92%</strong></div><div class="board-kpi"><small>VGV confirmado</small><strong>R$ 4,8 mi</strong></div></div><div class="board-charts"><div class="board-chart"><small>Evolução de atendimentos</small><div class="bars">${[39,62,48,75,55,95,81].map((h,i)=>`<i style="--h:${h}%;--delay:${450+i*110}ms"></i>`).join('')}</div></div><div class="board-chart"><small>Origem dos leads</small><div class="donut"></div></div></div></div></div>`, 'dark','dashboard-scene')}
function scene7(s){return node(s,`<div class="metric-grid">${s.stats.map((x,i)=>{const numeric=parseInt(x.value,10);return `<div class="metric pop" ${delay(i+1)}><strong data-count="${numeric}" data-prefix="${esc(x.prefix||'')}" data-suffix="${x.value.includes('+')?'+':''}">${esc((x.prefix||'')+x.value)}</strong><p>${esc(x.label)}</p></div>`}).join('')}</div><div class="stats-bottom reveal" style="--delay:620ms"><i></i><span>Resultados e condições informados no material original da proposta.</span></div>`, 'dark','metrics-scene')}
function scene8(s){return node(s,`<div class="differ-grid">${s.cards.map((c,i)=>`<div class="differ-card pop" ${delay(i+1)}><span class="differ-no">DIFERENCIAL 0${i+1}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>`, 'light','differ-scene')}
function scene9(s){return node(s,`<div class="risk-layout"><div class="risk-visual reveal" style="--delay:170ms" aria-hidden="true"><div class="orbit"></div><div class="shield"></div></div><div class="risk-list">${s.cards.map((c,i)=>`<div class="risk-item reveal" ${delay(i+1)}><span class="num">${esc(c.number)}</span><div><strong>${esc(c.title)}</strong><p>${esc(c.text)}</p></div></div>`).join('')}</div></div>`, 'dark','risk-scene')}
function scene10(s){return node(s,`<div class="compare-layout">${s.rows.map((r,i)=>`<div class="compare-row reveal ${i===3?'highlight':''}" ${delay(i+1)}><b><span class="row-index">0${i+1}</span>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>`, 'light','comparison-scene')}
function scene11(s){return node(s,`<div class="automation-layout">${s.cards.map((c,i)=>`<div class="auto-card pop" ${delay(i+1)}><div><span class="tiny-label">FLUXO 0${i+1}</span><h3>${esc(c.title)}</h3></div><div><span class="state-title">HOJE</span><p>${esc(getText(c.today))}</p></div><div class="line-arrow" aria-hidden="true"></div><div><span class="state-title">PRÓXIMA ETAPA</span><p>${esc(getText(c.next))}</p></div></div>`).join('')}</div>`, 'dark','automation-scene')}
function scene12(s){return node(s,`<div class="prices">${s.plans.map((p,i)=>`<button class="price-card pop ${i===1?'dark-card':''} ${selectedPlan===i?'selected':''}" ${delay(i+1)} data-plan="${i}" aria-pressed="${selectedPlan===i}"><span class="tag">${i===0?'PLANO RECOMENDADO':'MAIS HORAS / MÊS'}</span><span class="price-title">${esc(p.name)}</span><span class="monthly">${esc(p.monthly)} <small>/mês</small></span><span class="price-detail"><b>${esc(p.setup)}</b> de implantação<br><b>${esc(p.hours)}</b> de melhorias por mês<br>${esc(p.detail)}</span></button>`).join('')}<div class="price-card pop" ${delay(3)}><span class="tag">PAGO PELA PLACE</span><span class="price-title">Hospedagem e ferramentas</span><span class="monthly">${esc(s.infra.range)} <small>/mês</small></span><span class="price-detail">${esc(s.infra.text)}<br>Despesas separadas da mensalidade.</span></div></div><div class="pricing-alert" id="plan-alert">O valor não aumenta por corretor contratado. Selecione um plano para comparar os benefícios.</div>`, 'light','pricing-scene')}
function scene13(s){return node(s,`<div class="cost-layout"><div class="cost-row reveal" ${delay(1)}><strong>CRM pronto · 50 usuários</strong><div class="cost-track"><span style="--width:86%"></span></div><span class="cost-value">R$ 3.250/mês</span></div><div class="cost-row reveal" ${delay(2)}><strong>Dev júnior</strong><div class="cost-track"><span style="--width:100%"></span></div><span class="cost-value">R$ 3–6 mil/mês</span></div><div class="cost-row focus reveal" ${delay(3)}><strong>Esta plataforma</strong><div class="cost-track"><span style="--width:76%"></span></div><span class="cost-value">R$ 2.840–2.940/mês</span></div><div class="compare-row reveal" ${delay(4)}><b>Construção de sistema externo</b><p>R$ 5.000 a R$ 20.000 para construir, além de manutenção. É investimento inicial, não mensalidade.</p></div><div class="cost-note">Barras ilustrativas de comparação, não uma escala financeira exata. Valores aproximados conforme a proposta; implantação e custos adicionais são separados.</div></div>`, 'light','cost-scene')}
function scene14(s){return node(s,`<div class="coverage-layout">${s.cards.map((c,i)=>`<div class="coverage-card pop" ${delay(i+1)}><span class="tiny-label">${esc(c.eyebrow)}</span><h3>${esc(c.title)}</h3><ul>${c.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div><p class="footline">${esc(s.footnote)}</p>`, 'light','coverage-scene')}
function scene15(s){return node(s,`<div class="roadmap-layout">${s.steps.map((c,i)=>`<div class="milestone reveal" ${delay(i+1)}><small>${esc(c.when)}</small><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>`, 'dark','roadmap-scene')}
function scene16(s){return node(s,`<div class="pilot-layout">${s.cards.map((c,i)=>`<div class="pilot-card pop" ${delay(i+1)}><div class="circle-stat">${esc(c.number)}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div><p class="footline">${esc(s.footnote)}</p>`, 'light','pilot-scene')}
function scene17(s){return node(s,`<div class="decision-layout">${s.cards.map((c,i)=>`<button class="decision-item pop ${choices.has(i)?'checked':''}" ${delay(i+1)} data-decision="${i}" aria-pressed="${choices.has(i)}"><span class="square">${choices.has(i)?'✓':esc(c.number)}</span><div><b>${esc(c.title)}</b><p>${esc(c.text)}</p></div></button>`).join('')}</div><p class="decision-foot">Marque os pontos apenas para acompanhar a conversa; isso não registra nem formaliza uma aprovação.</p>`, 'light','decision-scene').replace('class="scene light decision-scene"','class="scene light decision-scene"')}
function scene18(s){return `<article class="scene closing-scene dark" data-chapter="18"><div class="hero-visual" aria-hidden="true"><div class="halo"></div><svg class="pin-css brand-symbol" viewBox="0 0 260 350" aria-hidden="true" focusable="false"><path fill="#d9a661" fill-rule="evenodd" d="M130 18C69 18 25 62 25 132C25 224 73 268 130 335C190 262 235 221 235 132C235 63 189 18 130 18Z M130 71C96 71 77 97 77 132C77 169 97 201 130 201C165 201 184 168 184 132C184 96 163 71 130 71Z"/><ellipse cx="130" cy="137" rx="23" ry="34" fill="#d9a661"/></svg><div class="three-canvas" data-three="pin"></div></div><div class="closing-overlay"><div class="eyebrow reveal" style="--delay:120ms">PLACE BROKERS · NOVEMBRO 2026</div><img class="reveal" style="--delay:230ms" src="assets/logo.png" alt="Place Brokers — Negócios Imobiliários"><h1 class="reveal" style="--delay:350ms">Obrigado. <span class="accent">Vamos seguir juntos?</span></h1><p class="lead reveal" style="--delay:470ms">${esc(s.description||'')}</p><p class="closing-team reveal" style="--delay:570ms">${esc(s.footnote)}</p><button class="primary-action reveal" style="--delay:680ms" data-action="restart">↻ &nbsp; Rever a apresentação</button></div></article>`}
const factories=[null,scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11,scene12,scene13,scene14,scene15,scene16,scene17,scene18];
const storeKey='place-brokers-first-silent-v1';
function loadPreferences(){try{const x=JSON.parse(localStorage.getItem(storeKey)||'{}');tourSeconds=Math.max(3,Math.min(12,Number(x.tourSeconds)||8));$('#tour-time').value=String(tourSeconds);$('#tour-time-out').value=tourSeconds+' s';$('#reduce-motion').checked=!!x.reduced;$('#contrast').checked=!!x.contrast;document.body.classList.toggle('reduced-motion',!!x.reduced);document.body.classList.toggle('high-contrast',!!x.contrast)}catch(e){console.warn('Preferências não carregadas',e)}updateControls()}
function savePreferences(){try{localStorage.setItem(storeKey,JSON.stringify({tourSeconds,reduced:$('#reduce-motion').checked,contrast:$('#contrast').checked}))}catch(e){}}
function updateControls(){$('#play-icon').textContent=auto?'Ⅱ':'▶';$('#play-label').textContent=auto?'Pausar tour':'Tour automático';$('#play-btn').setAttribute('aria-pressed',String(auto))}
function cancelChapterTimers(){clearTimeout(motionTimer);clearTimeout(autoTimer);motionTimer=autoTimer=null}
function scheduleAuto(){clearTimeout(autoTimer);if(!auto||document.querySelector('dialog[open]')||document.hidden)return;if(current>=pages.length){auto=false;updateControls();return}const at=current,version=sceneVersion;autoTimer=setTimeout(()=>{if(auto&&current===at&&sceneVersion===version)render(at+1)},tourSeconds*1000)}
function setAuto(value){auto=Boolean(value);updateControls();scheduleAuto()}
function render(id,{focus=false}={}){if(id<1||id>pages.length)return;cancelChapterTimers();three.dispose();const version=++sceneVersion;current=id;const s=pages[id-1];const theme=darkIds.has(id)?'dark':id===17?'gold-bg':'light';stage.className='stage '+theme;stage.innerHTML=factories[id](s);$('#top-counter').innerHTML=String(id).padStart(2,'0')+' <i>/</i> '+pages.length;$('#rail-counter').innerHTML=String(id).padStart(2,'0')+'<br><i>/</i>'+pages.length;$('#chapter-label').textContent=s.kicker.toUpperCase();$('#current-scene-name').textContent=s.title;$('#progress-fill').style.width=(id/pages.length*100)+'%';$('#rail-progress').style.setProperty('--rail-percent',id/pages.length*100+'%');$('#prev-btn').disabled=id===1;$('#next-btn').disabled=id===pages.length;document.title=`${s.title} | Place Brokers`;document.querySelectorAll('.chapter-link').forEach(e=>e.classList.toggle('active',Number(e.dataset.goto)===id));stage.scrollTop=0;requestAnimationFrame(()=>{if(version!==sceneVersion)return;stage.querySelector('.scene')?.classList.add('is-visible');const host=stage.querySelector('[data-three]');if(host)three.mount(host)});motionTimer=setTimeout(()=>{if(current===id&&version===sceneVersion)animateCounters()},450);scheduleAuto();if(focus)stage.focus({preventScroll:true});}
function animateCounters(){stage.querySelectorAll('[data-count]').forEach(el=>{const target=Number(el.dataset.count);if(!Number.isFinite(target))return;const prefix=el.dataset.prefix||'',suffix=el.dataset.suffix||'';const t0=performance.now(),duration=900;function tick(t){if(!el.isConnected)return;const k=Math.min(1,(t-t0)/duration),ease=1-Math.pow(1-k,3);el.textContent=prefix+Math.floor(target*ease)+suffix;if(k<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function goto(id){render(id,{focus:true})}
function setFlowStep(i){const slide=pages[2];if(current!==3||!slide)return;const n=Math.min(4,Math.max(0,Number(i)||0));stage.querySelectorAll('[data-flow]').forEach(b=>{const selected=Number(b.dataset.flow)===n;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});const orb=$('#lead-orb');if(orb)orb.style.setProperty('--step',n);const name=$('#flow-detail-name'),desc=$('#flow-detail-text');if(name)name.textContent=slide.steps[n].name.toUpperCase();if(desc)desc.textContent=slide.steps[n].text;three.setStep(n)}
function interact(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.action==='start'){setAuto(true);goto(2)}else if(b.dataset.action==='explore'){goto(2)}else if(b.dataset.action==='restart'){goto(1)}else if(b.hasAttribute('data-flow'))setFlowStep(b.dataset.flow);
 else if(b.hasAttribute('data-pain')){stage.querySelectorAll('[data-pain]').forEach(x=>x.classList.toggle('active',x===b))}else if(b.hasAttribute('data-site-lead')){const x=$('#lead-toast');if(x){x.hidden=false;clearTimeout(x._hide);x._hide=setTimeout(()=>x.hidden=true,3700)}}
 else if(b.hasAttribute('data-contact')){const x=stage.querySelector('.phone-notice');if(x){x.innerHTML=b.dataset.contact==='ligar'?'☎ Ligação demonstrativa iniciada<small>Sem realizar uma ligação real</small>':'◉ WhatsApp demonstrativo<small>Exemplo visual de atendimento, sem abrir conversa real</small>'}}
 else if(b.hasAttribute('data-plan')){selectedPlan=Number(b.dataset.plan);stage.querySelectorAll('[data-plan]').forEach(x=>{const active=x===b;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active))});const alert=$('#plan-alert');if(alert)alert.textContent=selectedPlan===0?'Plano Recomendado: R$ 4.000 de implantação, R$ 2.000 por mês e 15 h de melhorias.':'Plano Completo: R$ 6.000 de implantação, R$ 3.000 por mês e 25 h de melhorias.'}
 else if(b.hasAttribute('data-decision')){const i=Number(b.dataset.decision);choices.has(i)?choices.delete(i):choices.add(i);b.classList.toggle('checked',choices.has(i));b.setAttribute('aria-pressed',String(choices.has(i)));b.querySelector('.square').textContent=choices.has(i)?'✓':String(i+1).padStart(2,'0')}
}
async function loadData(){if(window.PLACE_SLIDES)return window.PLACE_SLIDES;const r=await fetch('data/cenas.json');if(!r.ok)throw Error('Conteúdo não encontrado');return r.json()}
function setupEvents(){
stage.addEventListener('click',interact);
$('#prev-btn').addEventListener('click',()=>goto(current-1));$('#next-btn').addEventListener('click',()=>goto(current+1));$('#play-btn').addEventListener('click',()=>setAuto(!auto));
$('#menu-btn').addEventListener('click',()=>$('#menu-dialog').showModal());$('#settings-btn').addEventListener('click',()=>$('#settings-dialog').showModal());
$('#fullscreen-btn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));
document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target===d)d.close()});d.addEventListener('close',scheduleAuto)});
$('#chapter-list').addEventListener('click',e=>{const x=e.target.closest('[data-goto]');if(x){$('#menu-dialog').close();goto(Number(x.dataset.goto))}});
$('#tour-time').addEventListener('input',e=>{tourSeconds=Number(e.target.value);$('#tour-time-out').value=tourSeconds+' s';savePreferences();scheduleAuto()});
$('#reduce-motion').addEventListener('change',e=>{document.body.classList.toggle('reduced-motion',e.target.checked);savePreferences();render(current)});
$('#contrast').addEventListener('change',e=>{document.body.classList.toggle('high-contrast',e.target.checked);savePreferences()});
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.querySelector('dialog[open]'))return;if(['ArrowRight','ArrowLeft',' ','f','F'].includes(e.key))e.preventDefault();if(e.key==='ArrowRight')goto(current+1);else if(e.key==='ArrowLeft')goto(current-1);else if(e.key===' ')setAuto(!auto);else if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(autoTimer);else scheduleAuto()});
window.addEventListener('pagehide',()=>{cancelChapterTimers();three.dispose()})
}
async function init(){try{pages=await loadData();$('#chapter-list').innerHTML=pages.map(s=>`<button type="button" class="chapter-link" data-goto="${s.id}"><b>${String(s.id).padStart(2,'0')}</b><span>${esc(s.title)}</span></button>`).join('');loadPreferences();setupEvents();render(1)}catch(err){stage.innerHTML=`<div style="padding:50px"><h1>Não foi possível abrir a apresentação.</h1><p>${esc(err.message)}</p><p>Abra a versão HTML única ou inicie um servidor local: <code>python -m http.server 8000</code>.</p></div>`;console.error(err)}}
init();

</script>
</body>
</html>
