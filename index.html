<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07182a">
<title>Place Brokers | Uma história do lead às chaves</title>
<meta name="description" content="Experiência animada em 18 capítulos baseada na proposta da plataforma Place Brokers.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#scene">Ir para a apresentação</a>
<div id="app" class="app">
  <aside class="rail" aria-label="Atalhos">
    <div class="rail-logo" aria-hidden="true"><span>p</span></div>
    <button class="rail-btn" id="menu-btn" title="Ver os 18 capítulos" aria-label="Abrir lista de capítulos"><span>☷</span></button>
    <div class="rail-progress" id="rail-progress" aria-hidden="true"></div>
    <span class="rail-counter" id="rail-counter">01<br><i>/</i>18</span>
    <button class="rail-btn" id="settings-btn" title="Configurações" aria-label="Ajustes"><span>⚙</span></button>
  </aside>
  <div class="main-column">
    <header class="topbar">
      <div class="topbrand"><img src="assets/logo.png" alt="Place Brokers, Negócios Imobiliários"><div class="topbrand-divider"></div><div><strong>DO LEAD ÀS CHAVES</strong><span>UMA HISTÓRIA EM MOVIMENTO</span></div></div>
      <div class="topnav"><span id="chapter-label">ABERTURA</span><span id="top-counter">01 <i>/</i> 18</span><button class="top-minor" id="fullscreen-btn" title="Tela cheia (F)">⛶ <span>TELA CHEIA</span></button></div>
    </header>
    <div class="progress-line"><span id="progress-fill"></span></div>
    <main class="stage" id="scene" tabindex="-1" aria-label="Capítulo atual"></main>
    
    <footer class="controls">
      <div class="controls-left"><button id="prev-btn" class="arrow-btn" aria-label="Capítulo anterior">←</button><button id="next-btn" class="arrow-btn gold-arrow" aria-label="Próximo capítulo">→</button><div class="now-playing"><span class="now-playing-kicker">CAPÍTULO ATUAL</span><span id="current-scene-name">A plataforma da Place</span></div></div>
      <div class="controls-right"><button id="play-btn" class="play-btn" aria-pressed="false"><span id="play-icon">▶</span><span id="play-label">Tour automático</span></button></div>
    </footer>
  </div>
</div>
<dialog id="menu-dialog" class="dialog menu-dialog" aria-labelledby="menu-title"><header><div><small>MAPA DA APRESENTAÇÃO</small><h2 id="menu-title">18 capítulos animados</h2></div><button class="dialog-close" data-close="menu-dialog" aria-label="Fechar menu">×</button></header><nav class="chapter-list" id="chapter-list" aria-label="Selecionar um capítulo"></nav></dialog>
<dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title"><header><div><small>PERSONALIZAÇÃO</small><h2 id="settings-title">Ajustes da experiência</h2></div><button class="dialog-close" data-close="settings-dialog" aria-label="Fechar ajustes">×</button></header><div class="settings-content"><label>Tempo por capítulo <span><input id="tour-time" type="range" min="3" max="12" step="1" value="8"><output id="tour-time-out">8 s</output></span></label><label>Reduzir movimentos <input id="reduce-motion" type="checkbox"></label><label>Alto contraste <input id="contrast" type="checkbox"></label><p class="fine-print">Apresentação visual sem áudio ou legendas. Use as setas do teclado para navegar.</p></div></dialog>

<noscript><div class="noscript">Ative o JavaScript para ver a apresentação animada.</div></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
